[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "omnimd"
version = "2.0.2"
description = "把任意文件转成信息完整的 Markdown——正文锚点，图片链接、内嵌、转写、描述按需组合，图片里的信息同样可看、可检索"
readme = "README.md"
license = "MIT"
authors = [{ name = "Junwei Zuo", email = "zjw010519@gmail.com" }]
requires-python = ">=3.10"
keywords = [
    "markdown",
    "llm",
    "document-conversion",
    "ocr",
    "vlm",
    "rag",
    "pdf-to-markdown",
    "multimodal",
    "image-transcription",
    "coding-agent",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "markitdown[all]>=0.1.4",
    "pymupdf4llm>=1.0",
    "Pillow>=10.0",
    "openai>=1.50",
    "boto3>=1.34",
    "python-dotenv>=1.0",
    "platformdirs>=4",
    "firecrawl-anydoc>=0.2",
]

[project.optional-dependencies]
# dev：测试与开发工具——fastapi / python-multipart / httpx 供 demo 契约测试，pyyaml 供 skill 校验，
# pytest-benchmark 供库性能基准（tests/library/test_benchmark.py）
dev = ["pytest>=8", "pytest-benchmark>=4", "httpx>=0.27", "pyyaml>=6", "fastapi", "python-multipart"]

[project.scripts]
omnimd = "omnimd.cli:main"

[project.urls]
Homepage = "https://github.com/kie0519/omnimd"
Repository = "https://github.com/kie0519/omnimd"
"Bug Tracker" = "https://github.com/kie0519/omnimd/issues"
Documentation = "https://github.com/kie0519/omnimd#文档"
Changelog = "https://github.com/kie0519/omnimd/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["omnimd*"]

[tool.setuptools.package-data]
omnimd = ["py.typed"]
